<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>路飞电竞 · 手机管理</title>
<script src="https://cdn.jsdelivr.net/npm/webconnect/dist/umd/webconnect.js"></script>
<style>
:root{--bg:#0d1117;--panel:#161b22;--stroke:#21262d;--text:#c9d1d9;--accent:#58a6ff;--green:#238636;--red:#da3633;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-overflow-scrolling:touch;padding-bottom:90px}
.admin-top{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--stroke);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.admin-top-title{font-size:17px;font-weight:700;color:var(--accent);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-status{font-size:12px;color:#8b949e;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.04);flex-shrink:0;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-status.ok{color:#3fb950;background:rgba(63,185,80,.14)}
.admin-status.err{color:#f85149;background:rgba(248,81,73,.14)}
.admin-status.busy{color:var(--accent);background:rgba(88,166,255,.14);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.admin-body{padding:20px 20px 130px}
.admin-tabs{display:flex;gap:8px;overflow-x:auto;padding:0 0 16px;-webkit-overflow-scrolling:touch}
.admin-tabs::-webkit-scrollbar{display:none}
.admin-tab{flex-shrink:0;padding:10px 18px;font-size:14px;border:none;background:var(--stroke);color:#8b949e;border-radius:10px;cursor:pointer;white-space:nowrap}
.admin-tab.active{background:var(--green);color:#fff}
.admin-pane{display:none}
.admin-pane.active{display:block}
.admin-card{background:var(--panel);border:1px solid var(--stroke);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.admin-card-title{font-size:16px;font-weight:700;color:#e6edf3;margin-bottom:14px;padding-left:12px;border-left:4px solid var(--accent);display:flex;align-items:center;justify-content:space-between;gap:10px}
.count-badge{font-size:12px;font-weight:600;color:var(--accent);background:rgba(88,166,255,.12);padding:3px 9px;border-radius:6px}
.count-badge.full{color:#f85149;background:rgba(248,81,73,.14)}
.admin-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.admin-label{font-size:13px;color:#8b949e}
.admin-input,.admin-textarea{width:100%;padding:11px 14px;font-size:15px;color:#e6edf3;background:#0d1117;border:1px solid #30363d;border-radius:8px;outline:none;font-family:inherit}
.admin-input:focus,.admin-textarea:focus{border-color:var(--accent)}
.admin-input[readonly]{opacity:.7;cursor:not-allowed;background:#0a0c10}
.admin-textarea{min-height:80px;resize:vertical;line-height:1.5}
.admin-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.admin-accent{width:100%;height:42px;border:1px solid #30363d;border-radius:8px;background:#0d1117;cursor:pointer}
.admin-range{width:100%;height:6px;-webkit-appearance:none;appearance:none;background:#30363d;border-radius:3px;outline:none;cursor:pointer;margin:6px 0}
.admin-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--green);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4);border:none}
.admin-range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--green);cursor:pointer;border:none;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.admin-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;font-size:15px;font-weight:600;color:var(--text);background:var(--stroke);border:1px solid #30363d;border-radius:9px;cursor:pointer;font-family:inherit;white-space:nowrap}
.admin-btn:active{transform:scale(.97)}
.admin-btn.primary{background:var(--green);border-color:#2ea043;color:#fff}
.admin-btn.danger{background:var(--red);border-color:#f85149;color:#fff}
.admin-btn.small{padding:8px 14px;font-size:13px}
.admin-btn.full{width:100%}
.admin-btn:disabled{opacity:.45;cursor:not-allowed}
.admin-bar{position:fixed;left:0;right:0;bottom:0;z-index:11;padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--stroke);display:flex;gap:10px;box-shadow:0 -2px 12px rgba(0,0,0,.4)}
.admin-bar .admin-btn{flex:1}
.admin-item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.admin-item-idx{font-size:12px;color:#8b949e;background:var(--stroke);padding:3px 9px;border-radius:5px}
.admin-bg-preview{width:100%;height:160px;border-radius:8px;background:#000 center/cover no-repeat;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;color:#484f58;font-size:14px}
.admin-warn{font-size:13px;color:#8b949e;line-height:1.7;padding:12px;background:rgba(88,166,255,.06);border-radius:8px;border-left:3px solid var(--accent);margin-bottom:14px;word-break:break-all}
.admin-warn.danger{color:#f85149;background:rgba(248,81,73,.08);border-left-color:#f85149}
.admin-progress{font-size:12px;color:var(--accent);padding:6px 10px;background:rgba(88,166,255,.06);border-radius:6px;margin-bottom:12px;text-align:center}
.admin-progress.full{color:#f85149;background:rgba(248,81,73,.08)}
.admin-toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:99999;padding:14px 28px;font-size:15px;color:#3fb950;background:rgba(13,17,23,.98);border:2px solid rgba(46,160,67,.7);border-radius:12px;box-shadow:0 0 30px rgba(46,160,67,.4);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:86vw;overflow:hidden;text-overflow:ellipsis}
.admin-toast.show{opacity:1}
.admin-toast.err{color:#f85149;border-color:rgba(248,81,73,.7);box-shadow:0 0 30px rgba(248,81,73,.4)}
.admin-modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.admin-modal.show{display:flex}
.admin-modal-inner{background:var(--panel);border:1px solid var(--stroke);border-radius:16px;padding:26px 22px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.admin-modal-title{font-size:18px;font-weight:700;color:#e6edf3;margin-bottom:8px;text-align:center}
.admin-modal-desc{font-size:14px;color:#8b949e;margin-bottom:18px;line-height:1.6;text-align:center}
.admin-modal-input{width:100%;padding:14px;font-size:22px;text-align:center;letter-spacing:6px;color:#e6edf3;background:#0d1117;border:2px solid #30363d;border-radius:10px;outline:none;font-family:monospace;font-weight:700;margin-bottom:16px}
.admin-modal-input:focus{border-color:var(--accent)}
.admin-modal-btns{display:flex;gap:10px}
.admin-modal-btns .admin-btn{flex:1}
.admin-info{font-size:13px;color:#8b949e;text-align:center;margin-bottom:14px}
.admin-info .code{font-size:18px;font-weight:700;color:#3fb950;letter-spacing:3px;font-family:monospace}
.admin-range-value{font-size:16px;font-weight:700;color:#3fb950;font-family:monospace;margin-left:8px}
@media (max-width: 480px){ .admin-row{grid-template-columns:1fr;} .admin-body{padding:16px 14px 130px;} .admin-card{padding:16px;} .admin-input,.admin-textarea{font-size:16px;} }
</style>
</head>
<body>
<div id="adminApp">
  <div class="admin-top">
    <div class="admin-top-title">⚙️ 手机管理</div>
    <div class="admin-status" id="adminStatus">初始化…</div>
  </div>
  <div class="admin-body">
    <div class="admin-info" id="adminInfoBar"></div>
    <div class="admin-tabs" id="adminTabs">
      <button class="admin-tab active" data-tab="basic">基本</button>
      <button class="admin-tab" data-tab="prices">价格</button>
      <button class="admin-tab" data-tab="schedule">时段</button>
      <button class="admin-tab" data-tab="vip">会员</button>
      <button class="admin-tab" data-tab="announce">公告</button>
      <button class="admin-tab" data-tab="bg">背景</button>
      <button class="admin-tab" data-tab="footer">页脚</button>
    </div>
    <div class="admin-pane active" id="pane-basic"></div>
    <div class="admin-pane" id="pane-prices"></div>
    <div class="admin-pane" id="pane-schedule"></div>
    <div class="admin-pane" id="pane-vip"></div>
    <div class="admin-pane" id="pane-announce"></div>
    <div class="admin-pane" id="pane-bg"></div>
    <div class="admin-pane" id="pane-footer"></div>
  </div>
  <div class="admin-bar">
    <button class="admin-btn" id="adminReloadBtn">🔄 拉取</button>
    <button class="admin-btn primary" id="adminSendBtn">💾 保存到电视</button>
  </div>
</div>
<div id="adminToast" class="admin-toast"></div>

<!-- 配对码输入弹窗 -->
<div class="admin-modal" id="codeModal">
  <div class="admin-modal-inner">
    <div class="admin-modal-title">连接电视</div>
    <div class="admin-modal-desc">请输入电视上显示的 6 位配对码<br>（首次使用请扫描电视「扫码管理」二维码）</div>
    <input class="admin-modal-input" id="codeInput" type="tel" inputmode="numeric" maxlength="6" placeholder="------" autocomplete="off">
    <div class="admin-modal-btns">
      <button class="admin-btn" id="codeCancelBtn">取消</button>
      <button class="admin-btn primary" id="codeOkBtn">连接</button>
    </div>
  </div>
</div>

<script>
var MAX_CARDS = 6;

/* ========= 配对码与 ID 解析 ========= */
var urlParams = new URLSearchParams(location.search);
var urlHost = urlParams.get('host') || '';
var urlCode = (urlParams.get('code') || '').replace(/\D/g, '');

function readCodeMap(){
  try { return JSON.parse(localStorage.getItem('lufei_code_map') || '{}'); } catch(e){ return {}; }
}
function writeCodeMap(map){
  try { localStorage.setItem('lufei_code_map', JSON.stringify(map)); } catch(e){}
}
function saveCodeMapping(code, host){
  if (!code || !host) return;
  var map = readCodeMap();
  map[code] = host;
  writeCodeMap(map);
}
function hostFromCode(code){
  var map = readCodeMap();
  return map[code] || '';
}

if (urlHost) {
  try { localStorage.setItem('lufei_tv_host', urlHost); } catch(e){}
  if (urlCode) saveCodeMapping(urlCode, urlHost);
}

var TARGET_HOST_ID = urlHost || localStorage.getItem('lufei_tv_host') || '';

function renderInfoBar(){
  var bar = document.getElementById('adminInfoBar');
  if (!bar) return;
  var map = readCodeMap();
  var codes = Object.keys(map);
  if (TARGET_HOST_ID) {
    var knownCode = codes.find(function(c){ return map[c] === TARGET_HOST_ID; }) || '';
    bar.innerHTML = knownCode
      ? '配对码 <span class="code">' + knownCode + '</span>'
      : '已连接电视（未记录配对码）';
  } else {
    bar.textContent = '未连接电视，请输配对码或扫描电视二维码';
  }
}
renderInfoBar();

/* ========= 配对码输入弹窗 ========= */
var codeModal = document.getElementById('codeModal');
var codeInput = document.getElementById('codeInput');

function openCodeModal(){
  if (!codeModal) return;
  codeModal.classList.add('show');
  if (codeInput){ codeInput.value = ''; setTimeout(function(){ codeInput.focus(); }, 100); }
}
function closeCodeModal(){ if (codeModal) codeModal.classList.remove('show'); }

function tryConnectByCode(code){
  code = (code || '').replace(/\D/g, '');
  if (code.length !== 6){ toast('请输入 6 位配对码', true); return; }
  var host = hostFromCode(code);
  if (!host){
    toast('未找到该配对码，请先扫描电视二维码一次', true);
    return;
  }
  localStorage.setItem('lufei_tv_host', host);
  localStorage.setItem('lufei_last_code', code);
  TARGET_HOST_ID = host;
  closeCodeModal();
  renderInfoBar();
  setStatus('🔄 正在连接…', 'busy');
  tryConnect();
}

if (codeInput) {
  codeInput.addEventListener('input', function(){
    this.value = this.value.replace(/\D/g, '').slice(0, 6);
  });
  codeInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') tryConnectByCode(codeInput.value);
  });
}
document.getElementById('codeOkBtn').onclick = function(){ tryConnectByCode(codeInput.value); };
document.getElementById('codeCancelBtn').onclick = function(){ closeCodeModal(); };

if (!TARGET_HOST_ID) {
  setTimeout(openCodeModal, 200);
}

/* ========= 默认配置 ========= */
var DEFAULT_CONFIG = {
  brand: { name:'路飞电竞', sub:'LUFEI E-SPORTS', logo:'https://diskmirror.lingyuzhao.top/1193/Binary/logo.png' },
  service: { hours:'24H 全天候', wifiName:'路飞电竞', wifiPwd:'lufeidianjing', hotline:'166 0418 6135' },
  vip: [
    { pay:'39.9', bonus:'到手100元' },
    { pay:'100', bonus:'到手300元' },
    { pay:'200', bonus:'到手600元' },
    { pay:'500', bonus:'到手1600元' }
  ],
  announcements: [{ cls:'pink', text:'<span class="hl-pink">【消防公告】</span>公共场所火灾处置流程' }],
  prices: {
    timer: { title:'计时价格', unit:'元 / 小时', cards:[
      { name:'大厅', price:'11', config:'9700X + RTX 5070', accent:'#00ff9d' },
      { name:'包间', price:'16.8', config:'7800X3D + RTX 5070', accent:'#00b3ff' },
      { name:'精品包', price:'17.8', config:'9800X3D + RTX 5070 <br>外设自选', accent:'#ff00e5' },
      { name:'豪华包', price:'21.8', config:'9800X3D + RTX 5080 <br>外设自选', accent:'#ff6d00' },
      { name:'至尊包', price:'26.8', config:'9800X3D + RTX 5080 <br>旗舰外设', accent:'#ffe600' },
      { name:'超豪华包', price:'32.8', config:'9800X3D + RTX 5080 <br>旗舰外设', accent:'#aa66ff' }
    ]},
    night: { title:'包宿', unit:'21:55 — 07:00', cards:[
      { name:'大厅', price:'30', config:'9700X + 5070', accent:'#ff00e5' },
      { name:'包间', price:'40', config:'7800X3D + 5070', accent:'#00b3ff' },
      { name:'精品包', price:'50', config:'9800X3D + 5070', accent:'#ff00e5' },
      { name:'豪华包', price:'60', config:'9800X3D + 5080', accent:'#ff6d00' },
      { name:'至尊包', price:'70', config:'9800X3D + 5080', accent:'#ffe600' },
      { name:'超豪华包', price:'80', config:'9800X3D + RTX 5080', accent:'#aa66ff' }
    ]},
    morning: { title:'包早', unit:'07:00 — 13:00', cards:[
      { name:'大厅', price:'12.9', config:'9700X + 5070', accent:'#00ff9d' },
      { name:'包间', price:'17.8', config:'7800X3D + 5070', accent:'#00b3ff' },
      { name:'精品双人包', price:'29.9', config:'9800X3D + 5070', accent:'#ff00e5' },
      { name:'精品单人包', price:'39.9', config:'9800X3D + 5080', accent:'#ff00e5' },
      { name:'豪华包', price:'49.9', config:'9800X3D + 5080', accent:'#ff6d00' }
    ]}
  },
  bg: {
    default:'bjsp/常规时段.jpg',
    morning:'bjsp/包早时段.jpg',
    night:'bjsp/包宿时段.jpg',
    opacity: 0.6
  },
  schedule: {
    morningStart: '07:00',
    morningEnd: '13:00',
    nightStart: '21:55',
    nightEnd: '07:00'
  },
  footer: {
    rules: ['未成年人禁止入内','请携带有效身份证件登记','大厅禁止吸烟','妥善保管个人物品'],
    slogan: '路飞电竞 · 畅享游戏世界',
    phone: '166 0418 6135'
  }
};

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toHex(c){ if (typeof c !== 'string') return '#00ff9d'; if (/^#[0-9a-f]{6}$/i.test(c)) return c; if (/^#[0-9a-f]{3}$/i.test(c)) return '#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3]; return '#00ff9d'; }
function normalizeTimeStr(s){
  var m = /^(\d{1,2}):(\d{2})$/.exec(String(s||''));
  if (!m) return null;
  var h = parseInt(m[1],10), mi = parseInt(m[2],10);
  if (isNaN(h) || isNaN(mi) || h<0 || h>23 || mi<0 || mi>59) return null;
  return (h<10?'0'+h:h) + ':' + (mi<10?'0'+mi:mi);
}

function normalizeConfig(saved){
  var out = deepClone(DEFAULT_CONFIG);
  if (!saved || typeof saved !== 'object') return out;
  if (saved.brand && typeof saved.brand === 'object'){ ['name','sub','logo'].forEach(function(k){ if (typeof saved.brand[k]==='string') out.brand[k]=saved.brand[k]; }); }
  if (saved.service && typeof saved.service === 'object'){ ['hours','wifiName','wifiPwd','hotline'].forEach(function(k){ if (typeof saved.service[k]==='string') out.service[k]=saved.service[k]; }); }
  if (Array.isArray(saved.vip) && saved.vip.length){ out.vip = saved.vip.map(function(v){ v=v||{}; return { pay:v.pay!=null?String(v.pay):'', bonus:v.bonus!=null?String(v.bonus):'' }; }); }
  if (Array.isArray(saved.announcements) && saved.announcements.length){ out.announcements = saved.announcements.map(function(a){ a=a||{}; return { cls:typeof a.cls==='string'?a.cls:'', text:a.text!=null?String(a.text):'' }; }); }
  if (saved.prices && typeof saved.prices === 'object'){
    ['timer','night','morning'].forEach(function(k){
      var s=saved.prices[k]; if(!s||typeof s!=='object') return;
      if(typeof s.title==='string') out.prices[k].title=s.title;
      if(typeof s.unit==='string') out.prices[k].unit=s.unit;
      if(Array.isArray(s.cards)){
        out.prices[k].cards = s.cards.map(function(c,i){
          var d = DEFAULT_CONFIG.prices[k].cards[i] || { name:'', price:'', config:'', accent:'#00ff9d' };
          c = c || {};
          return {
            name: c.name!=null?String(c.name):d.name,
            price: c.price!=null?String(c.price):d.price,
            config: c.config!=null?String(c.config):d.config,
            accent: (typeof c.accent==='string'&&c.accent)?c.accent:d.accent
          };
        });
      }
    });
  }
  if (saved.bg && typeof saved.bg === 'object'){
    ['default','morning','night'].forEach(function(k){ if (typeof saved.bg[k] === 'string') out.bg[k] = saved.bg[k]; });
    if (typeof saved.bg.opacity === 'number' && saved.bg.opacity >= 0 && saved.bg.opacity <= 1){
      out.bg.opacity = saved.bg.opacity;
    } else if (typeof saved.bg.opacity === 'string' && saved.bg.opacity !== ''){
      var op = parseFloat(saved.bg.opacity);
      if (!isNaN(op) && op >= 0 && op <= 1) out.bg.opacity = op;
    }
  }
  if (saved.schedule && typeof saved.schedule === 'object'){
    ['morningStart','morningEnd','nightStart','nightEnd'].forEach(function(k){
      var t = normalizeTimeStr(saved.schedule[k]);
      if (t) out.schedule[k] = t;
    });
  }
  if (saved.footer && typeof saved.footer === 'object'){
    if (Array.isArray(saved.footer.rules) && saved.footer.rules.length){ out.footer.rules = saved.footer.rules.map(function(r){ return r!=null?String(r):''; }); }
    if (typeof saved.footer.slogan === 'string') out.footer.slogan = saved.footer.slogan;
    if (typeof saved.footer.phone === 'string') out.footer.phone = saved.footer.phone;
  }

  /* unit 由 schedule 生成，保证一致 */
  out.prices.night.unit = out.schedule.nightStart + ' — ' + out.schedule.nightEnd;
  out.prices.morning.unit = out.schedule.morningStart + ' — ' + out.schedule.morningEnd;

  return out;
}

var toastEl = document.getElementById('adminToast');
var toastTimer = null;
function toast(msg, isErr){
  toastEl.textContent = msg;
  toastEl.className = 'admin-toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
}
var statusEl = document.getElementById('adminStatus');
function setStatus(txt, cls){ statusEl.textContent = txt; statusEl.className = 'admin-status' + (cls ? ' ' + cls : ''); }

var currentCfg = null;
try { var draftRaw = localStorage.getItem('lufei_admin_draft'); if (draftRaw) currentCfg = normalizeConfig(JSON.parse(draftRaw)); } catch(e){}
if (!currentCfg) currentCfg = deepClone(DEFAULT_CONFIG);

var cc = null;
try { cc = (typeof webconnect === 'function') ? webconnect() : null; } catch(e){ cc = null; }
var connected = false, myId = '', lastPongTs = 0, heartbeatTimer = null, checkTimer = null, reconnectTimer = null, pendingApply = null;

function tryConnect(){
  if (!cc || !TARGET_HOST_ID) return;
  try {
    if (typeof cc.connectTo === 'function') cc.connectTo(TARGET_HOST_ID);
    else if (typeof cc.connect === 'function') cc.connect(TARGET_HOST_ID);
    else if (typeof cc.join === 'function') cc.join(TARGET_HOST_ID);
  } catch(e){}
}
function doSend(obj, cb){
  if (!cc){ if (cb) cb(false, 'no-cc'); return; }
  try {
    cc.getConnection(function(a){
      if (!a || !a.connection){ if (cb) cb(false, 'no-conn'); return; }
      try { cc.Send(JSON.stringify(obj), { connectId: a.connection }); if (cb) cb(true); }
      catch(e){ if (cb) cb(false, String(e && e.message || e)); }
    });
  } catch(e){ if (cb) cb(false, String(e && e.message || e)); }
}
function sendWithRetry(obj, maxTries, cb){
  var tries = 0;
  function attempt(){
    tries++;
    doSend(obj, function(ok, err){
      if (ok){ if (cb) cb(true); return; }
      if (tries >= maxTries){ if (cb) cb(false, err); return; }
      setTimeout(attempt, 400 + tries * 300);
    });
  }
  attempt();
}
function startHeartbeat(){
  stopHeartbeat(); lastPongTs = Date.now();
  heartbeatTimer = setInterval(function(){ if (!connected) return; doSend({ type:'ping', t: Date.now() }); }, 10000);
  checkTimer = setInterval(function(){
    if (!connected) return;
    if (Date.now() - lastPongTs > 32000){
      connected = false; setStatus('⚠️ 重连中…', 'busy'); tryConnect();
      setTimeout(function(){ if (!connected) setStatus('❌ 重连失败', 'err'); }, 8000);
    }
  }, 5000);
}
function stopHeartbeat(){
  if (heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer = null; }
  if (checkTimer){ clearInterval(checkTimer); checkTimer = null; }
}

if (cc && TARGET_HOST_ID){
  try { cc.getMyId(function(a){ myId = (a && a.connectId) || ''; }); } catch(e){}
  try {
    cc.onConnect(function(a){
      connected = true; lastPongTs = Date.now();
      setStatus('✅ 已连接电视', 'ok'); toast('✅ 已连接电视');
      startHeartbeat();
      setTimeout(function(){ requestConfig(true); }, 400);
    });
  } catch(e){}
  try {
    cc.onDisconnect(function(){
      connected = false; stopHeartbeat();
      setStatus('⚠️ 断开重连…', 'busy');
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(tryConnect, 2500);
    });
  } catch(e){}
  try {
    cc.onReceive(function(data){
      try {
        var m = null;
        try { m = JSON.parse(data); } catch(e){ return; }
        if (!m || typeof m !== 'object') return;
        if (m.type === 'pong'){
          lastPongTs = Date.now();
          if (!connected){ connected = true; setStatus('✅ 已连接电视', 'ok'); startHeartbeat(); }
          return;
        }
        if (m.type === 'admin-config' && m.data){
          currentCfg = normalizeConfig(m.data);
          if (m.code && TARGET_HOST_ID) saveCodeMapping(String(m.code), TARGET_HOST_ID);
          renderInfoBar();
          renderAdminAll();
          saveDraft();
          toast('✅ 已拉取配置');
          return;
        }
        if (m.type === 'admin-applied'){
          if (m.ok === false){ pendingApply = null; toast('❌ 保存失败', true); }
          else { pendingApply = null; toast('✅ 已应用'); }
          return;
        }
        if (m.type === 'admin-busy'){ toast('电视忙，稍后重试', true); return; }
      } catch(e){}
    });
  } catch(e){}
  setTimeout(tryConnect, 300);
} else {
  setStatus('⚠️ 缺少 host，无法连接', 'err');
}
setTimeout(function(){ if (!connected && TARGET_HOST_ID) setStatus('⚠️ 未连上，检查 WiFi', 'err'); }, 10000);

    else { setStatus('⚠️ 拉取失败', 'err'); if (!silent) toast('拉取失败: ' + (err || ''), true); }
  });
}

    '<div class="admin-warn">0 = 完全透明（看不到背景图）；1 = 完全不透明。建议 0.3 ~ 0.7 之间</div>' +

  });
  html += '</div>';

  document.getElementById('pane-bg').innerHTML = html;

  ['default','morning','night'].forEach(refreshBgPreview);

  var range = document.querySelector('[data-bind="bg.opacity"]');
  if (range){
    range.addEventListener('input', function(){
      var val = parseFloat(range.value);
      var lbl = document.getElementById('bgOpacityLabel');
      if (lbl) lbl.textContent = isNaN(val) ? '--' : val.toFixed(2);
    });
  }

  document.querySelectorAll('[data-bgfile]').forEach(function(inp){
    inp.onchange = function(){
      var key = inp.getAttribute('data-bgfile'), f = inp.files && inp.files[0];
      inp.value = '';
      if (!f) return;
      toast('压缩中…');
      compressImg(f, 1600, 0.8, function(dataUrl){
        if (!dataUrl){ toast('处理失败', true); return; }
        var input = document.querySelector('[data-bind="bg.' + key + '"]');
        if (input) input.value = dataUrl;

  });
  document.querySelectorAll('[data-bind^="bg."]').forEach(function(inp){
    if (inp.getAttribute('data-bind') === 'bg.opacity') return;
    inp.addEventListener('input', function(){

function refreshBgPreview(key){

  else { preview.style.backgroundImage = ''; preview.textContent = '无图片'; }

function compressImg(file, maxW, quality, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      try {
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (!w || !h) return cb(null);
        if (w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(cv.toDataURL('image/jpeg', quality));
      } catch(err){ cb(null); }
    };
    img.onerror = function(){ cb(null); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ cb(null); };
  reader.readAsDataURL(file);
}

function syncFromForm(){
  var out = deepClone(currentCfg);
  document.querySelectorAll('#adminApp [data-bind]').forEach(function(inp){
    var path = inp.getAttribute('data-bind'), val = inp.value, parts = path.split('.');
    if (parts[0] === 'footer' && parts[1] === 'rules'){
      out.footer.rules = val.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
      return;
    }
    if (parts[0] === 'bg' && parts[1] === 'opacity'){
      var op = parseFloat(val);
      if (!isNaN(op) && op >= 0 && op <= 1) out.bg.opacity = op;
      return;
    }
    if (parts[0] === 'schedule'){
      var t = normalizeTimeStr(val);
      if (t) out.schedule[parts[1]] = t;
      return;
    }
    var obj = out;
    for (var i = 0; i < parts.length - 1; i++){
      var k = parts[i];
      if (obj[k] == null) obj[k] = isNaN(parseInt(parts[i+1], 10)) ? {} : [];
      obj = obj[k];
    }
    obj[parts[parts.length-1]] = val;
  });

  /* unit 由 schedule 生成 */
  if (out.schedule){
    if (out.schedule.nightStart && out.schedule.nightEnd){
      out.prices.night.unit = out.schedule.nightStart + ' — ' + out.schedule.nightEnd;
    }
    if (out.schedule.morningStart && out.schedule.morningEnd){
      out.prices.morning.unit = out.schedule.morningStart + ' — ' + out.schedule.morningEnd;
    }
  }

  currentCfg = normalizeConfig(out);
  return currentCfg;
}
