<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>路飞电竞 · 手机管理</title>
<script src="https://cdn.jsdelivr.net/npm/webconnect/dist/umd/webconnect.js"></script>
<style>
:root{--bg:#0d1117;--panel:#161b22;--stroke:#21262d;--text:#c9d1d9;--accent:#58a6ff;--green:#238636;--red:#da3633;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-overflow-scrolling:touch;padding-bottom:90px}
.admin-top{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--stroke);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.admin-top-title{font-size:17px;font-weight:700;color:var(--accent);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-status{font-size:12px;color:#8b949e;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.04);flex-shrink:0;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-status.ok{color:#3fb950;background:rgba(63,185,80,.14)}
.admin-status.err{color:#f85149;background:rgba(248,81,73,.14)}
.admin-status.busy{color:var(--accent);background:rgba(88,166,255,.14);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.admin-body{padding:20px 20px 130px}
.admin-tabs{display:flex;gap:8px;overflow-x:auto;padding:0 0 16px;-webkit-overflow-scrolling:touch}
.admin-tabs::-webkit-scrollbar{display:none}
.admin-tab{flex-shrink:0;padding:10px 18px;font-size:14px;border:none;background:var(--stroke);color:#8b949e;border-radius:10px;cursor:pointer;white-space:nowrap}
.admin-tab.active{background:var(--green);color:#fff}
.admin-pane{display:none}
.admin-pane.active{display:block}
.admin-card{background:var(--panel);border:1px solid var(--stroke);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.admin-card-title{font-size:16px;font-weight:700;color:#e6edf3;margin-bottom:14px;padding-left:12px;border-left:4px solid var(--accent);display:flex;align-items:center;justify-content:space-between;gap:10px}
.admin-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.admin-label{font-size:13px;color:#8b949e}
.admin-input,.admin-textarea{width:100%;padding:11px 14px;font-size:15px;color:#e6edf3;background:#0d1117;border:1px solid #30363d;border-radius:8px;outline:none;font-family:inherit}
.admin-input:focus,.admin-textarea:focus{border-color:var(--accent)}
.admin-textarea{min-height:80px;resize:vertical;line-height:1.5}
.admin-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.admin-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;font-size:15px;font-weight:600;color:var(--text);background:var(--stroke);border:1px solid #30363d;border-radius:9px;cursor:pointer;font-family:inherit;white-space:nowrap}
.admin-btn:active{transform:scale(.97)}
.admin-btn.primary{background:var(--green);border-color:#2ea043;color:#fff}
.admin-btn.danger{background:var(--red);border-color:#f85149;color:#fff}
.admin-btn.small{padding:8px 14px;font-size:13px}
.admin-btn.full{width:100%}
.admin-btn:disabled{opacity:.45;cursor:not-allowed}
.admin-bar{position:fixed;left:0;right:0;bottom:0;z-index:11;padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--stroke);display:flex;gap:10px;box-shadow:0 -2px 12px rgba(0,0,0,.4)}
.admin-bar .admin-btn{flex:1}
.admin-toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:99999;padding:14px 28px;font-size:15px;color:#3fb950;background:rgba(13,17,23,.98);border:2px solid rgba(46,160,67,.7);border-radius:12px;box-shadow:0 0 30px rgba(46,160,67,.4);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:86vw;overflow:hidden;text-overflow:ellipsis}
.admin-toast.show{opacity:1}
.admin-toast.err{color:#f85149;border-color:rgba(248,81,73,.7);box-shadow:0 0 30px rgba(248,81,73,.4)}
.admin-modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.admin-modal.show{display:flex}
.admin-modal-inner{background:var(--panel);border:1px solid var(--stroke);border-radius:16px;padding:26px 22px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.admin-modal-title{font-size:18px;font-weight:700;color:#e6edf3;margin-bottom:8px;text-align:center}
.admin-modal-desc{font-size:14px;color:#8b949e;margin-bottom:18px;line-height:1.6;text-align:center}
.admin-modal-input{width:100%;padding:14px;font-size:22px;text-align:center;letter-spacing:6px;color:#e6edf3;background:#0d1117;border:2px solid #30363d;border-radius:10px;outline:none;font-family:monospace;font-weight:700;margin-bottom:16px}
.admin-modal-input:focus{border-color:var(--accent)}
.admin-modal-btns{display:flex;gap:10px}
.admin-modal-btns .admin-btn{flex:1}
.admin-warn{font-size:13px;color:#8b949e;line-height:1.7;padding:12px;background:rgba(88,166,255,.06);border-radius:8px;border-left:3px solid var(--accent);margin-bottom:14px;word-break:break-all}
.admin-warn.danger{color:#f85149;background:rgba(248,81,73,.08);border-left-color:#f85149}
.count-badge{font-size:12px;font-weight:600;color:var(--accent);background:rgba(88,166,255,.12);padding:3px 9px;border-radius:6px}
@media (max-width: 480px){ .admin-row{grid-template-columns:1fr;} .admin-body{padding:16px 14px 130px;} .admin-card{padding:16px;} .admin-input,.admin-textarea{font-size:16px;} }
</style>
</head>
<body>
<div id="adminApp">
  <div class="admin-top">
    <div class="admin-top-title">⚙️ 手机管理</div>
    <div class="admin-status" id="adminStatus">初始化…</div>
  </div>
  <div class="admin-body">
    <div class="admin-tabs" id="adminTabs">
      <button class="admin-tab active" data-tab="basic">基本</button>
      <button class="admin-tab" data-tab="prices">价格</button>
      <button class="admin-tab" data-tab="schedule">时段</button>
      <button class="admin-tab" data-tab="vip">会员</button>
      <button class="admin-tab" data-tab="announce">公告</button>
      <button class="admin-tab" data-tab="bg">背景</button>
      <button class="admin-tab" data-tab="footer">页脚</button>
      <button class="admin-tab" data-tab="music">🎵 音乐控制</button>
    </div>
    
    <div class="admin-pane active" id="pane-basic"></div>
    <div class="admin-pane" id="pane-prices"></div>
    <div class="admin-pane" id="pane-schedule"></div>
    <div class="admin-pane" id="pane-vip"></div>
    <div class="admin-pane" id="pane-announce"></div>
    <div class="admin-pane" id="pane-bg"></div>
    <div class="admin-pane" id="pane-footer"></div>
    
    <div class="admin-pane" id="pane-music">
      <div class="admin-card">
        <div class="admin-card-title">📁 大文件上传</div>
        <div class="admin-warn">采用 P2P 分块传输，支持百兆无损音频。上传时请保持手机亮屏并停留在当前页面。</div>
        <input type="file" id="mobileMusicInput" accept="audio/*" multiple style="width:100%; padding:12px; background:#0d1117; border:1px solid #30363d; border-radius:8px; margin-bottom:15px; color:#fff;">
        <button class="admin-btn primary full" id="mobileMusicUploadBtn">🚀 开始上传</button>

        <!-- 上传进度条 -->
        <div id="uploadProgressWrap" style="display:none; margin-top:16px;">
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#c9d1d9; margin-bottom:8px;">
            <span id="uploadFileName" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; margin-right:10px;">准备中…</span>
            <span id="uploadPercent" style="color:#3fb950; font-weight:700; flex-shrink:0;">0%</span>
          </div>
          <div style="width:100%; height:12px; background:#0d1117; border-radius:6px; overflow:hidden; border:1px solid #30363d;">
            <div id="uploadBar" style="width:0%; height:100%; background:linear-gradient(90deg,#238636,#3fb950); transition:width .15s linear;"></div>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:11px; color:#8b949e; margin-top:6px;">
            <span id="uploadSpeed">--</span>
            <span id="uploadProgressDetail">0 B / 0 B</span>

      </div>

      <div class="admin-card">

        <input type="range" id="musicProgress" min="0" max="100" value="0" style="width:100%; cursor:pointer; margin-bottom:15px;">
        
        <div style="display:flex;gap:10px;margin-bottom:10px;">
          <button class="admin-btn" id="musicPrev" style="flex:1;">⏮ 上一首</button>
          <button class="admin-btn primary" id="musicToggle" style="flex:2;">⏯ 播放/暂停</button>

      <div class="admin-card">

<!-- 配对码输入弹窗 -->
<div class="admin-modal" id="codeModal">
  <div class="admin-modal-inner">
    <div class="admin-modal-title">连接电视</div>
    <div class="admin-modal-desc">请输入电视上显示的 6 位配对码</div>
    <input class="admin-modal-input" id="codeInput" type="tel" inputmode="numeric" maxlength="6" placeholder="------" autocomplete="off">
    <div class="admin-modal-btns">
      <button class="admin-btn" id="codeCancelBtn">取消</button>
      <button class="admin-btn primary" id="codeOkBtn">连接</button>
    </div>

<script>
/* ========= 变量与工具函数 ========= */
var MAX_CARDS = 6;
var urlParams = new URLSearchParams(location.search);
var urlHost = urlParams.get('host') || '';
var urlCode = (urlParams.get('code') || '').replace(/\D/g, '');

function readCodeMap(){ try { return JSON.parse(localStorage.getItem('lufei_code_map') || '{}'); } catch(e){ return {}; } }
function writeCodeMap(map){ try { localStorage.setItem('lufei_code_map', JSON.stringify(map)); } catch(e){} }
function saveCodeMapping(code, host){ if (!code || !host) return; var map = readCodeMap(); map[code] = host; writeCodeMap(map); }
function hostFromCode(code){ var map = readCodeMap(); return map[code] || ''; }

if (urlHost) {
  try { localStorage.setItem('lufei_tv_host', urlHost); } catch(e){}
  if (urlCode) saveCodeMapping(urlCode, urlHost);
}
var TARGET_HOST_ID = urlHost || localStorage.getItem('lufei_tv_host') || '';

var toastEl = document.getElementById('adminToast');
var toastTimer = null;
function toast(msg, isErr){
  toastEl.textContent = msg;
  toastEl.className = 'admin-toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
}
var statusEl = document.getElementById('adminStatus');
function setStatus(txt, cls){ statusEl.textContent = txt; statusEl.className = 'admin-status' + (cls ? ' ' + cls : ''); }

/* ========= Webconnect 连接逻辑 ========= */
var cc = null;
try { cc = (typeof webconnect === 'function') ? webconnect() : null; } catch(e){ cc = null; }
var connected = false, myId = '', lastPongTs = 0, heartbeatTimer = null, checkTimer = null, reconnectTimer = null;

function tryConnect(){
  if (!cc || !TARGET_HOST_ID) return;
  try {
    if (typeof cc.connectTo === 'function') cc.connectTo(TARGET_HOST_ID);
    else if (typeof cc.connect === 'function') cc.connect(TARGET_HOST_ID);
    else if (typeof cc.join === 'function') cc.join(TARGET_HOST_ID);
  } catch(e){}
}
function doSend(obj, cb){
  if (!cc){ if (cb) cb(false, 'no-cc'); return; }
  try {
    cc.getConnection(function(a){
      if (!a || !a.connection){ if (cb) cb(false, 'no-conn'); return; }
      try { cc.Send(JSON.stringify(obj), { connectId: a.connection }); if (cb) cb(true); }
      catch(e){ if (cb) cb(false, String(e && e.message || e)); }
    });
  } catch(e){ if (cb) cb(false, String(e && e.message || e)); }
}
function sendWithRetry(obj, maxTries, cb){
  var tries = 0;
  function attempt(){
    tries++;
    doSend(obj, function(ok, err){
      if (ok){ if (cb) cb(true); return; }
      if (tries >= maxTries){ if (cb) cb(false, err); return; }
      setTimeout(attempt, 400 + tries * 300);
    });
  }
  attempt();
}
function startHeartbeat(){
  stopHeartbeat(); lastPongTs = Date.now();
  heartbeatTimer = setInterval(function(){ if (!connected) return; doSend({ type:'ping', t: Date.now() }); }, 10000);
  checkTimer = setInterval(function(){
    if (!connected) return;
    if (Date.now() - lastPongTs > 32000){
      connected = false; setStatus('⚠️ 重连中…', 'busy'); tryConnect();
      setTimeout(function(){ if (!connected) setStatus('❌ 重连失败', 'err'); }, 8000);
    }
  }, 5000);
}
function stopHeartbeat(){
  if (heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer = null; }
  if (checkTimer){ clearInterval(checkTimer); checkTimer = null; }
}

window.filePC = null;

if (cc && TARGET_HOST_ID){
  try { cc.getMyId(function(a){ myId = (a && a.connectId) || ''; }); } catch(e){}
  try {
    cc.onConnect(function(a){
      connected = true; lastPongTs = Date.now();
      setStatus('✅ 已连接电视', 'ok'); toast('✅ 已连接电视');
      startHeartbeat();
      setTimeout(function(){ requestConfig(true); }, 400);
    });
  } catch(e){}
  try {
    cc.onDisconnect(function(){
      connected = false; stopHeartbeat();
      setStatus('⚠️ 断开重连…', 'busy');
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(tryConnect, 2500);
    });
  } catch(e){}
  try {
    cc.onReceive(function(data){
      try {
        var m = null;
        try { m = JSON.parse(data); } catch(e){ return; }
        if (!m || typeof m !== 'object') return;
        if (m.type === 'pong'){
          lastPongTs = Date.now();
          if (!connected){ connected = true; setStatus('✅ 已连接电视', 'ok'); startHeartbeat(); }
          return;
        }
        if (m.type === 'admin-config' && m.data){
          currentCfg = normalizeConfig(m.data);
          if (m.code && TARGET_HOST_ID) saveCodeMapping(String(m.code), TARGET_HOST_ID);
          renderAdminAll();
          saveDraft();
          toast('✅ 已拉取配置');
          return;
        }
        if (m.type === 'admin-applied'){
          if (m.ok === false){ toast('❌ 保存失败', true); }
          else { toast('✅ 已应用'); }
          return;
        }
        // 处理大文件传输的信令
        if (m.type === 'file-answer' && window.filePC) {
          window.filePC.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: m.sdp })).catch(function(e){
            console.error('setRemoteDescription Error:', e);
            toast('❌ P2P 建立失败', true);
            showUploadProgress(false);
            window.__isUploading = false;
          });
          return;
        }
        if (m.type === 'file-ice' && window.filePC) {
          window.filePC.addIceCandidate(new RTCIceCandidate(m.candidate)).catch(function(){});
          return;
        }
        // 处理音乐状态同步
        if (m.type === 'music-state') {
          updateMusicUI(m);
          return;
        }
      } catch(e){}
    });
  } catch(e){}
  setTimeout(tryConnect, 300);
} else {
  setStatus('⚠️ 缺少 host', 'err');
}

function requestConfig(silent){
  if (!connected){ if (!silent) toast('未连接电视', true); return; }
  setStatus('📥 拉取中…', 'busy');
  sendWithRetry({ type:'admin-request' }, 3, function(ok, err){
    if (ok){ if (!silent) toast('正在拉取…'); }
    else { setStatus('⚠️ 拉取失败', 'err'); if (!silent) toast('拉取失败', true); }
  });
}

/* ========= 音乐状态同步与 UI 更新 ========= */
function formatTime(s) {
  if (!s || isNaN(s)) return "00:00";
  var m = Math.floor(s / 60);
  var sec = Math.floor(s % 60);
  return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
}

var progressEl = document.getElementById('musicProgress');

function updateMusicUI(state) {
  var listEl = document.getElementById('bgMusicList');
  var countEl = document.getElementById('bgMusicCount');
  var curTimeEl = document.getElementById('bgTimeCurrent');
  var totalTimeEl = document.getElementById('bgTimeTotal');
  var toggleBtn = document.getElementById('musicToggle');

  if (!listEl) return;
  
  // 防止拖动进度条时被打断
  if (document.activeElement !== progressEl) {
    progressEl.max = state.duration || 0;
    progressEl.value = state.currentTime || 0;
  }
  
  curTimeEl.textContent = formatTime(state.currentTime);
  totalTimeEl.textContent = formatTime(state.duration);
  
  if (toggleBtn) {
    toggleBtn.textContent = state.isPlaying ? '⏸ 暂停' : '▶ 播放';
  }
  
  countEl.textContent = state.playlist.length + ' 首';
  
  // 重新渲染列表
  listEl.innerHTML = state.playlist.map((song, index) => {
    var isActive = (index === state.currentIndex);
    var bg = isActive ? 'background: rgba(88,166,255,0.15); color: #58a6ff;' : '';
    return `<div style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #30363d; ${bg}">
      <div style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;" onclick="playTargetIndex(${index})">
        ${index + 1}. ${song.name}
      </div>
      <button class="admin-btn small danger" style="padding:4px 8px; margin-left:10px;" onclick="deleteTargetIndex(${index})">删除</button>
    </div>`;
  }).join('') || '<div style="text-align:center; color:#8b949e; padding:20px;">暂无音乐</div>';

  // 高亮当前播放模式
  var singleBtn = document.getElementById('musicModeSingle');
  var listBtn = document.getElementById('musicModeList');
  if (singleBtn && listBtn) {
    if (state.playMode === 'single') {
      singleBtn.style.background = 'var(--green)'; singleBtn.style.borderColor = '#2ea043'; singleBtn.style.color = '#fff';
      listBtn.style.background = ''; listBtn.style.borderColor = ''; listBtn.style.color = '';
    } else {
      listBtn.style.background = 'var(--green)'; listBtn.style.borderColor = '#2ea043'; listBtn.style.color = '#fff';
      singleBtn.style.background = ''; singleBtn.style.borderColor = ''; singleBtn.style.color = '';
    }
  }
}

window.playTargetIndex = function(idx) {
  doSend({ type: 'music-command', action: 'play-index', payload: idx });
};

window.deleteTargetIndex = function(idx) {
  if(confirm('确定删除这首歌吗？')) {
    doSend({ type: 'music-command', action: 'delete', payload: idx });
  }
};

if (progressEl) {
  progressEl.addEventListener('change', function() {
    doSend({ type: 'music-command', action: 'seek', payload: parseInt(this.value) });
  });
}

/* ========= 配置表单逻辑 ========= */
var DEFAULT_CONFIG = {
  brand: { name:'路飞电竞', sub:'LUFEI E-SPORTS', logo:'https://diskmirror.lingyuzhao.top/1193/Binary/logo.png' },
  service: { hours:'24H 全天候', wifiName:'路飞电竞', wifiPwd:'lufeidianjing', hotline:'166 0418 6135' },
  vip: [
    { pay:'39.9', bonus:'到手100元' },
    { pay:'100', bonus:'到手300元' },
    { pay:'200', bonus:'到手600元' },
    { pay:'500', bonus:'到手1600元' }
  ],
  announcements: [{ cls:'pink', text:'<span class="hl-pink">【消防公告】</span>公共场所火灾处置流程' }],
  prices: {
    timer: { title:'计时价格', unit:'元 / 小时', cards:[
      { name:'大厅', price:'11', config:'9700X + RTX 5070', accent:'#00ff9d' },
      { name:'包间', price:'16.8', config:'7800X3D + RTX 5070', accent:'#00b3ff' },
      { name:'精品包', price:'17.8', config:'9800X3D + RTX 5070', accent:'#ff00e5' },
      { name:'豪华包', price:'21.8', config:'9800X3D + RTX 5080', accent:'#ff6d00' },
      { name:'至尊包', price:'26.8', config:'9800X3D + RTX 5080', accent:'#ffe600' },
      { name:'超豪华包', price:'32.8', config:'9800X3D + RTX 5080', accent:'#aa66ff' }
    ]},
    night: { title:'包宿', unit:'21:55 — 07:00', cards:[

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toHex(c){ if (typeof c !== 'string') return '#00ff9d'; if (/^#[0-9a-f]{6}$/i.test(c)) return c; if (/^#[0-9a-f]{3}$/i.test(c)) return '#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3]; return '#00ff9d'; }
function normalizeTimeStr(s){ var m = /^(\d{1,2}):(\d{2})$/.exec(String(s||'')); if (!m) return null; var h = parseInt(m[1],10), mi = parseInt(m[2],10); if (isNaN(h) || isNaN(mi) || h<0 || h>23 || mi<0 || mi>59) return null; return (h<10?'0'+h:h) + ':' + (mi<10?'0'+mi:mi); }

function normalizeConfig(saved){
  var out = deepClone(DEFAULT_CONFIG);
  if (!saved || typeof saved !== 'object') return out;
  if (saved.brand) ['name','sub','logo'].forEach(k => { if (typeof saved.brand[k]==='string') out.brand[k]=saved.brand[k]; });
  if (saved.service) ['hours','wifiName','wifiPwd','hotline'].forEach(k => { if (typeof saved.service[k]==='string') out.service[k]=saved.service[k]; });
  if (Array.isArray(saved.vip) && saved.vip.length) out.vip = saved.vip.map(v => ({ pay:v.pay||'', bonus:v.bonus||'' }));
  if (Array.isArray(saved.announcements) && saved.announcements.length) out.announcements = saved.announcements.map(a => ({ cls:a.cls||'', text:a.text||'' }));
  if (saved.prices) ['timer','night','morning'].forEach(k => {
    if (saved.prices[k]) {
      if (typeof saved.prices[k].title==='string') out.prices[k].title=saved.prices[k].title;
      if (typeof saved.prices[k].unit==='string') out.prices[k].unit=saved.prices[k].unit;
      if (Array.isArray(saved.prices[k].cards)) out.prices[k].cards = saved.prices[k].cards.map(c => ({ name:c.name||'', price:c.price||'', config:c.config||'', accent:c.accent||'#00ff9d' }));
    }
  });
  if (saved.bg) ['default','morning','night','opacity'].forEach(k => { if (saved.bg[k] !== undefined) out.bg[k] = saved.bg[k]; });
  if (saved.schedule) ['morningStart','morningEnd','nightStart','nightEnd'].forEach(k => { if (normalizeTimeStr(saved.schedule[k])) out.schedule[k] = normalizeTimeStr(saved.schedule[k]); });
  if (saved.footer) {
    if (Array.isArray(saved.footer.rules)) out.footer.rules = saved.footer.rules;
    if (typeof saved.footer.slogan==='string') out.footer.slogan = saved.footer.slogan;
    if (typeof saved.footer.phone==='string') out.footer.phone = saved.footer.phone;
  }
  return out;
}

function syncFromForm(){

  document.querySelectorAll('#adminApp [data-bind]').forEach(inp => {

    if (parts[0]==='footer' && parts[1]==='rules'){ out.footer.rules = val.split('\n').map(s=>s.trim()).filter(Boolean); return; }
    if (parts[0]==='bg' && parts[1]==='opacity'){ out.bg.opacity = parseFloat(val)||0.6; return; }
    if (parts[0]==='schedule'){ var t = normalizeTimeStr(val); if(t) out.schedule[parts[1]] = t; return; }
    var obj = out;
    for (var i=0; i<parts.length-1; i++){ obj = obj[parts[i]]; }
    obj[parts[parts.length-1]] = val;
  });
  currentCfg = normalizeConfig(out);
  return currentCfg;
}

/* --- 上传进度条工具 --- */
function formatBytes(bytes) {
  if (!bytes || bytes < 0) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1024 * 1024 * 1024) return (bytes / (1024*1024)).toFixed(2) + ' MB';
  return (bytes / (1024*1024*1024)).toFixed(2) + ' GB';
}
var uploadProgressState = { lastTime: 0, lastBytes: 0 };
function showUploadProgress(show) {
  var wrap = document.getElementById('uploadProgressWrap');
  if (wrap) wrap.style.display = show ? 'block' : 'none';
}
function updateUploadProgress(sentBytes, totalBytes, fileName, fileIdx, fileCount) {
  var pct = totalBytes > 0 ? Math.min(100, (sentBytes / totalBytes) * 100) : 0;
  var bar = document.getElementById('uploadBar');
  var pctEl = document.getElementById('uploadPercent');
  var nameEl = document.getElementById('uploadFileName');
  var speedEl = document.getElementById('uploadSpeed');
  var detailEl = document.getElementById('uploadProgressDetail');
  if (bar) bar.style.width = pct.toFixed(1) + '%';
  if (pctEl) pctEl.textContent = pct.toFixed(1) + '%';
  if (nameEl) nameEl.textContent = fileName ? ('(' + (fileIdx+1) + '/' + fileCount + ') ' + fileName) : '连接中…';
  if (detailEl) detailEl.textContent = formatBytes(sentBytes) + ' / ' + formatBytes(totalBytes);
  var now = Date.now();
  if (uploadProgressState.lastTime && (now - uploadProgressState.lastTime) >= 400) {
    var dt = (now - uploadProgressState.lastTime) / 1000;
    var db = sentBytes - uploadProgressState.lastBytes;
    var speed = db / dt;
    if (speedEl) speedEl.textContent = '↑ ' + formatBytes(speed) + '/s';
    uploadProgressState.lastTime = now;
    uploadProgressState.lastBytes = sentBytes;
  }
}

/* --- 上传入口 --- */
document.getElementById('mobileMusicUploadBtn').onclick = function() {
  if (window.__isUploading) return toast('正在上传中，请等待完成', true);
  var files = document.getElementById('mobileMusicInput').files;
  if (!files || files.length === 0) return toast('请先选择音频文件', true);
  if (!connected) return toast('未连接电视，无法发送', true);

  window.__isUploading = true;
  toast('正在建立 P2P 传输通道...');

  // 初始化进度条
  uploadProgressState.lastTime = Date.now();
  uploadProgressState.lastBytes = 0;
  var totalBytes = 0;
  for (var fi = 0; fi < files.length; fi++) totalBytes += files[fi].size;
  showUploadProgress(true);
  updateUploadProgress(0, totalBytes, '', 0, files.length);

  window.filePC = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  
  window.filePC.onicecandidate = function(e) {
    if (e.candidate) doSend({ type: 'file-ice', candidate: e.candidate });
  };

  var dc = window.filePC.createDataChannel('fileTransfer', { ordered: true });
  dc.binaryType = 'arraybuffer';
  
  dc.onopen = function() {
    toast('✅ 通道已建立，开始传输');
    sendFiles(dc, files);
  };
  
  dc.onerror = function(e) {
    toast('❌ 传输出错', true);
    showUploadProgress(false);
    window.__isUploading = false;
  };

  window.filePC.createOffer().then(function(offer) {
    return window.filePC.setLocalDescription(offer);
  }).then(function() {
    doSend({ type: 'file-offer', sdp: window.filePC.localDescription.sdp });
  }).catch(function(e) {
    toast('❌ 建立连接失败', true);
    showUploadProgress(false);
    window.__isUploading = false;
  });
};

// 队列传输文件（流控版 + 进度条）
function sendFiles(dc, files) {
  var currentFileIdx = 0;
  var CHUNK_SIZE = 64 * 1024; // 64KB 切片
  
  var totalBytes = 0;
  for (var fi = 0; fi < files.length; fi++) totalBytes += files[fi].size;
  var sentBytes = 0;
  
  function processNextFile() {
    if (currentFileIdx >= files.length) {
      toast('🎉 全部文件发送完成');
      if (window.filePC) { try { window.filePC.close(); } catch(e){} window.filePC = null; }
      window.__isUploading = false;
      setTimeout(function() { showUploadProgress(false); }, 2000);
      return;
    }

    var file = files[currentFileIdx];
    var totalChunks = Math.ceil(file.size / CHUNK_SIZE);
    var currentChunk = 0;
    
    toast('正在发送: ' + file.name);
    dc.send(JSON.stringify({ type: 'file-start', name: file.name }));

    function sendChunk() {
      if (currentChunk >= totalChunks) {
        dc.send(JSON.stringify({ type: 'file-end' }));
        toast('✅ ' + file.name + ' 发送完成');
        currentFileIdx++;
        setTimeout(processNextFile, 500);
        return;
      }
      
      // 背压控制
      if (dc.bufferedAmount > 256 * 1024) {
        setTimeout(sendChunk, 50);
        return;
      }
      
      var start = currentChunk * CHUNK_SIZE;
      var end = Math.min(start + CHUNK_SIZE, file.size);
      var slice = file.slice(start, end);
      
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          dc.send(e.target.result);
        } catch(err) {
          toast('❌ 发送中断', true);
          window.__isUploading = false;
          showUploadProgress(false);
          return;
        }
        sentBytes += (end - start);
        currentChunk++;
        updateUploadProgress(sentBytes, totalBytes, file.name, currentFileIdx, files.length);
        setTimeout(sendChunk, 0);
      };
      reader.readAsArrayBuffer(slice);
    }
    
    sendChunk();
  }
  
  processNextFile();
}
